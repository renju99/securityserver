user nginx;
worker_processes auto;
worker_rlimit_nofile 200000;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 65535;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # ── Per-user polling cache ────────────────────────────────────────────────
    # Keyed on URI + session cookie so each guard sees their own data.
    # 3-second TTL collapses concurrent poll requests from the same user/device
    # into a single upstream hit and acts as a stampede shield when many guards
    # open the app simultaneously.
    # 50 MB on-disk / 10 MB key zone holds ~80k keys comfortably.
    proxy_cache_path /var/cache/nginx/poll_cache
        levels=1:2
        keys_zone=poll_cache:10m
        max_size=50m
        inactive=30s
        use_temp_path=off;

    # ── Static asset cache ────────────────────────────────────────────────────
    # Odoo bundles are hash-versioned so they never change at the same URL.
    # 1-day browser TTL + 7-day proxy TTL eliminates repeated asset downloads
    # from every guard's device on shift start.
    proxy_cache_path /var/cache/nginx/asset_cache
        levels=1:2
        keys_zone=asset_cache:10m
        max_size=500m
        inactive=7d
        use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/extra.d/*.conf;
}







