version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro # Contains security, esign, .htpasswd
      # Mount separate configs for other apps
      - ../security/nginx-config/security.berkeleyuae.com.conf:/etc/nginx/extra.d/security.berkeleyuae.com.conf:ro
      - ../attendance/nginx-config/attendance.berkeleyuae.com.conf:/etc/nginx/extra.d/attendance.berkeleyuae.com.conf:ro
      - ../vendor-registration/nginx-config/vendor.berkeleyuae.com.conf:/etc/nginx/extra.d/vendor.berkeleyuae.com.conf:ro
      - ../cleaner-v2/nginx-config/cleaning.berkeleyuae.com.conf:/etc/nginx/extra.d/cleaning.berkeleyuae.com.conf:ro
      # Certbot volumes (reusing existing volumes to keep certs)
      - security_certbot-www:/var/www/certbot:ro
      - security_certbot-conf:/etc/letsencrypt:ro
    networks:
      - web-proxy-net
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - security_certbot-www:/var/www/certbot
      - security_certbot-conf:/etc/letsencrypt
    networks:
      - web-proxy-net
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  web-proxy-net:
    external: true

volumes:
  security_certbot-www:
    external: true
  security_certbot-conf:
    external: true
