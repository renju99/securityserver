<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Dashboard | Berkeley UAE</title>
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --bg: #f8f9fa;
            --white: #ffffff;
            --text: #333;
            --text-light: #666;
            --border: #e0e0e0;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
            color: white;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
        }

        .sidebar-header {
            padding: 0 24px 30px;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-menu {
            list-style: none;
            flex: 1;
        }

        .menu-item {
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.8);
            font-size: 15px;
            font-weight: 500;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .menu-item.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border-right: 4px solid white;
        }

        .sidebar-footer {
            padding: 20px 24px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Main Content */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 40px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .page-title h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: var(--text-light);
            font-size: 14px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--white);
            padding: 24px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stat-label {
            font-size: 13px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
        }

        /* Filters Section */
        .filters-section {
            background: var(--white);
            padding: 24px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            min-width: 200px;
        }

        .filter-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-light);
        }

        .filter-group select,
        .filter-group input {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        .filter-group select:focus,
        .filter-group input:focus {
            border-color: var(--primary);
        }

        .reset-btn {
            padding: 10px 20px;
            background: #eee;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
        }

        /* Table Section */
        .table-section {
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: #f8f9fa;
            padding: 16px;
            font-size: 13px;
            font-weight: 700;
            color: var(--text-light);
            text-transform: uppercase;
            border-bottom: 2px solid var(--border);
        }

        th.sortable {
            cursor: pointer;
            position: relative;
            user-select: none;
        }

        th.sortable:hover {
            background: #f1f3f5;
            color: var(--primary);
        }

        th.sortable::after {
            content: '↕';
            position: absolute;
            right: 8px;
            font-size: 10px;
            opacity: 0.3;
        }

        th.sort-asc::after {
            content: '↑';
            opacity: 1;
            color: var(--primary);
        }

        th.sort-desc::after {
            content: '↓';
            opacity: 1;
            color: var(--primary);
        }

        td {
            padding: 16px;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
        }

        tr:hover {
            background: #fcfcfc;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            display: inline-block;
            margin: 2px;
        }

        .badge-materials {
            background: #e1e7ff;
            color: #4361ee;
        }

        .badge-amc {
            background: #d1fae5;
            color: #059669;
        }

        .badge-manpower {
            background: #ffedd5;
            color: #ea580c;
        }

        .badge-other {
            background: #f3f4f6;
            color: #4b5563;
        }

        .badge-info {
            background: #e0f2fe;
            color: #0369a1;
            border: 1px dashed #0ea5e9;
        }

        .action-btn {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 13px;
        }

        .action-btn:hover {
            text-decoration: underline;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            visibility: hidden;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 1024px) {
            .sidebar {
                width: 80px;
            }

            .sidebar-header span,
            .menu-item span,
            .sidebar-footer {
                display: none;
            }

            .sidebar-header {
                justify-content: center;
                padding: 20px 0;
            }

            .menu-item {
                justify-content: center;
                padding: 20px 0;
            }

            .main-content {
                margin-left: 80px;
            }
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <span>🏢 Berkeley</span>
        </div>
        <ul class="sidebar-menu">
            <a href="/dashboard" class="menu-item active">
                <span>📊 Dashboard</span>
            </a>
            <a href="/uploads" class="menu-item">
                <span>📁 File Browser</span>
            </a>
        </ul>
        <div class="sidebar-footer">
            <a href="#" onclick="logout(); return false;" class="menu-item" style="padding:0">
                <span>🚪 Logout</span>
            </a>
        </div>
    </div>

    <div class="main-content">
        <header>
            <div class="page-title">
                <h1>Vendor Dashboard</h1>
                <p>Monitor registrations and nature of business segregation</p>
            </div>
            <div class="header-actions">
                <button class="reset-btn" onclick="fetchSubmissions()">🔄 Refresh Data</button>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Submissions</div>
                <div class="stat-value" id="totalSubmissions">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Materials Supply</div>
                <div class="stat-value" id="totalMaterials">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">AMC Services</div>
                <div class="stat-value" id="totalAMC">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Manpower Supply</div>
                <div class="stat-value" id="totalManpower">0</div>
            </div>
        </div>

        <div class="filters-section">
            <div class="filter-group" style="flex: 1.5;">
                <label>Search Company or Service</label>
                <input type="text" id="searchFilter" placeholder="Search name, services, tags..."
                    oninput="applyFilters()">
            </div>
            <div class="filter-group">
                <label>Emirate / Region</label>
                <select id="emirateFilter" onchange="applyFilters()">
                    <option value="all">All Regions</option>
                </select>
            </div>
            <button class="reset-btn" onclick="resetFilters()">Reset</button>
        </div>

        <div class="table-section">
            <table id="submissionsTable">
                <thead>
                    <tr>
                        <th style="width: 25%;" class="sortable" onclick="handleSort('companyName')" id="th-companyName">Company Name</th>
                        <th class="sortable" onclick="handleSort('tags')" id="th-tags">Services / Tags</th>
                        <th class="sortable" onclick="handleSort('country')" id="th-country">Country</th>
                        <th class="sortable" onclick="handleSort('emirates')" id="th-emirates">Emirate</th>
                        <th class="sortable sort-desc" onclick="handleSort('timestamp')" id="th-timestamp">Date Submitted</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="submissionsBody">
                    <!-- Data will be populated here -->
                </tbody>
            </table>
        </div>
    </div>

    <div id="loading" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <script>
        let allSubmissions = [];
        let currentSortField = 'timestamp';
        let currentSortOrder = 'desc';

        document.addEventListener('DOMContentLoaded', () => {
            if (!localStorage.getItem('vendor_auth')) {
                window.location.href = '/login';
                return;
            }
            fetchSubmissions();
        });

        async function fetchSubmissions() {
            showLoading(true);
            try {
                const response = await fetch('/api/submissions', {
                    headers: {
                        'Authorization': `Basic ${localStorage.getItem('vendor_auth')}`
                    }
                });

                if (response.status === 401) {
                    logout();
                    return;
                }

                allSubmissions = await response.json();
                populateFilters();
                updateStats();
                displaySubmissions(allSubmissions);
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to load submissions');
            } finally {
                showLoading(false);
            }
        }

        function populateFilters() {
            const emirateFilter = document.getElementById('emirateFilter');
            const emirates = [...new Set(allSubmissions.map(s => s.emirates).filter(Boolean))];

            emirateFilter.innerHTML = '<option value="all">All Regions</option>';
            emirates.forEach(e => {
                const option = document.createElement('option');
                option.value = e;
                option.textContent = e;
                emirateFilter.appendChild(option);
            });
        }

        function updateStats() {
            document.getElementById('totalSubmissions').textContent = allSubmissions.length;

            const materials = allSubmissions.filter(s => s.materialsSupply && s.materialsSupply.length > 0).length;
            const amc = allSubmissions.filter(s => s.amcServices && s.amcServices.length > 0).length;
            const manpower = allSubmissions.filter(s => s.manpowerSupply && s.manpowerSupply.length > 0).length;

            document.getElementById('totalMaterials').textContent = materials;
            document.getElementById('totalAMC').textContent = amc;
            document.getElementById('totalManpower').textContent = manpower;
        }

        function displaySubmissions(submissions) {
            const body = document.getElementById('submissionsBody');
            body.innerHTML = '';

            if (submissions.length === 0) {
                body.innerHTML = '<tr><td colspan="6" style="text-align:center; padding: 40px;">No submissions found</td></tr>';
                return;
            }

            submissions.forEach(s => {
                const row = document.createElement('tr');

                // Get all individual tags
                let tags = [];
                if (s.materialsSupply) s.materialsSupply.forEach(t => tags.push({ text: t, type: 'materials' }));
                if (s.amcServices) s.amcServices.forEach(t => tags.push({ text: t, type: 'amc' }));
                if (s.manpowerSupply) s.manpowerSupply.forEach(t => tags.push({ text: t, type: 'manpower' }));

                if (s.otherServices && s.otherServices !== 'Imported from storage') {
                    tags.push({ text: s.otherServices, type: 'other' });
                }

                if (s.synced && tags.length === 0) {
                    tags.push({ text: 'Sync Recovered', type: 'info' });
                }

                const badgeHtml = tags.map(t => `<span class="badge badge-${t.type}">${escapeHtml(t.text)}</span>`).join('');

                const date = new Date(s.timestamp).toLocaleDateString('en-GB', {
                    day: '2-digit', month: 'short', year: 'numeric'
                });

                row.innerHTML = `
                    <td style="font-weight:600">${escapeHtml(s.companyName)}</td>
                    <td>${badgeHtml || '<span class="text-light">No tags</span>'}</td>
                    <td>${escapeHtml(s.country || '-')}</td>
                    <td>${escapeHtml(s.emirates || '-')}</td>
                    <td>${date}</td>
                    <td>
                        <a href="/uploads/${s.companyFolder}/" class="action-btn">View Files</a>
                    </td>
                `;
                body.appendChild(row);
            });
        }

        function handleSort(field) {
            if (currentSortField === field) {
                currentSortOrder = currentSortOrder === 'asc' ? 'desc' : 'asc';
            } else {
                currentSortField = field;
                currentSortOrder = 'asc';
            }

            // Update UI headers
            document.querySelectorAll('th.sortable').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
            });
            const activeHeader = document.getElementById(`th-${field}`);
            if (activeHeader) {
                activeHeader.classList.add(currentSortOrder === 'asc' ? 'sort-asc' : 'sort-desc');
            }

            applyFilters();
        }

        function applyFilters() {
            const searchTerm = document.getElementById('searchFilter').value.toLowerCase();
            const emirate = document.getElementById('emirateFilter').value;

            let filtered = allSubmissions.filter(s => {
                const materials = s.materialsSupply || [];
                const amc = s.amcServices || [];
                const manpower = s.manpowerSupply || [];
                const other = s.otherServices || '';
                
                const allTagsStr = [...materials, ...amc, ...manpower, other].join(' ').toLowerCase();

                const searchMatch = s.companyName.toLowerCase().includes(searchTerm) ||
                    allTagsStr.includes(searchTerm);

                const matchesEmirate = emirate === 'all' || s.emirates === emirate;

                return searchMatch && matchesEmirate;
            });

            // Sort filtered results
            filtered.sort((a, b) => {
                let valA, valB;

                if (currentSortField === 'tags') {
                    valA = [...(a.materialsSupply || []), ...(a.amcServices || []), ...(a.manpowerSupply || []), a.otherServices || ''].join(' ');
                    valB = [...(b.materialsSupply || []), ...(b.amcServices || []), ...(b.manpowerSupply || []), b.otherServices || ''].join(' ');
                } else {
                    valA = a[currentSortField] || '';
                    valB = b[currentSortField] || '';
                }

                if (typeof valA === 'string') valA = valA.toLowerCase();
                if (typeof valB === 'string') valB = valB.toLowerCase();

                if (currentSortField === 'timestamp') {
                    valA = new Date(valA).getTime() || 0;
                    valB = new Date(valB).getTime() || 0;
                }

                if (valA < valB) return currentSortOrder === 'asc' ? -1 : 1;
                if (valA > valB) return currentSortOrder === 'asc' ? 1 : -1;
                return 0;
            });

            displaySubmissions(filtered);
        }

        function resetFilters() {
            document.getElementById('searchFilter').value = '';
            document.getElementById('emirateFilter').value = 'all';
            displaySubmissions(allSubmissions);
        }

        function logout() {
            localStorage.removeItem('vendor_auth');
            window.location.href = '/login';
        }

        function showLoading(show) {
            document.getElementById('loading').style.visibility = show ? 'visible' : 'hidden';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>

</html>
