services:
  db:
    image: postgres:15
    container_name: odoo_sales_db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - sales-odoo-db-data:/var/lib/postgresql/data/pgdata
    networks:
      - sales-odoo-network
    restart: unless-stopped

  odoo_sales:
    image: odoo:18
    container_name: odoo_sales
    depends_on:
      - db
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    ports:
      - "8071:8069"
    volumes:
      - sales-odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./custom_addons:/mnt/extra-addons
    command: ["odoo", "--config=/etc/odoo/odoo.conf"]
    networks:
      - sales-odoo-network
      - web-proxy-net
    restart: unless-stopped

volumes:
  sales-odoo-db-data:
  sales-odoo-web-data:

networks:
  sales-odoo-network:
    driver: bridge
  web-proxy-net:
    external: true
