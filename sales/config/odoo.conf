[options]
; Master password for database operations
admin_passwd = admin123

; Database connection
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = sales
db_filter = ^sales$

; HTTP
http_interface = 0.0.0.0
http_port = 8069

; Addons
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

; Runtime / logs
logfile = /var/lib/odoo/odoo.log
log_level = info
workers = 2
max_cron_threads = 1

; Security / proxy
list_db = False
proxy_mode = True
