[options]
admin_passwd = change_me_master_password

db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_filter = ^attendance

http_interface = 0.0.0.0
http_port = 8069

addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons

data_dir = /var/lib/odoo
logfile = /var/lib/odoo/odoo.log
log_level = info
workers = 2
max_cron_threads = 1

list_db = False
proxy_mode = True
