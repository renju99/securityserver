services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SOCKET_IO_REDIS_URL=${SOCKET_IO_REDIS_URL}
      - SOCKET_IO_REDIS_REQUIRED=${SOCKET_IO_REDIS_REQUIRED:-true}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - CORS_ALLOW_NO_ORIGIN=${CORS_ALLOW_NO_ORIGIN:-false}
      - JWT_REFRESH_COOKIE_SECURE=${JWT_REFRESH_COOKIE_SECURE:-true}
      - TRUST_PROXY_HOPS=${TRUST_PROXY_HOPS:-1}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-}
      - BIOMETRIC_INGEST_TOKEN=${BIOMETRIC_INGEST_TOKEN}
      - BIOMETRIC_STALE_MINS=${BIOMETRIC_STALE_MINS:-10}
      - BIOMETRIC_OFFLINE_MINS=${BIOMETRIC_OFFLINE_MINS:-30}
      - BIOMETRIC_ATTENDANCE_INTERVAL_MS=${BIOMETRIC_ATTENDANCE_INTERVAL_MS:-10000}
      - BIOMETRIC_ATTENDANCE_BATCH_SIZE=${BIOMETRIC_ATTENDANCE_BATCH_SIZE:-50}
      - BIOMETRIC_ATTENDANCE_MAX_ATTEMPTS=${BIOMETRIC_ATTENDANCE_MAX_ATTEMPTS:-20}
      - BIOMETRIC_ATTENDANCE_RETRY_BASE_SECONDS=${BIOMETRIC_ATTENDANCE_RETRY_BASE_SECONDS:-30}
      - BIOMETRIC_ATTENDANCE_RETRY_MAX_SECONDS=${BIOMETRIC_ATTENDANCE_RETRY_MAX_SECONDS:-900}
      - ODOO_SYNC_INTERVAL_MS=${ODOO_SYNC_INTERVAL_MS:-15000}
      - ODOO_SYNC_BATCH_SIZE=${ODOO_SYNC_BATCH_SIZE:-25}
      - ODOO_SYNC_MAX_ATTEMPTS=${ODOO_SYNC_MAX_ATTEMPTS:-288}
      - ODOO_SYNC_RETRY_BASE_SECONDS=${ODOO_SYNC_RETRY_BASE_SECONDS:-30}
      - ODOO_SYNC_RETRY_MAX_SECONDS=${ODOO_SYNC_RETRY_MAX_SECONDS:-900}
      - ZK_ICLOCK_ENABLED=${ZK_ICLOCK_ENABLED:-true}
      - ZK_ICLOCK_ALLOWED_SN=${ZK_ICLOCK_ALLOWED_SN:-}
      - ZK_ATTLOG_STAFF_PREFIX=${ZK_ATTLOG_STAFF_PREFIX:-}
      # ZKTeco TCP pull (node-zklib); no work if no ZKTeco_TCP rows with IP. Set ZK_TCP_PULL_ENABLED=false to turn off.
      - ZK_TCP_PULL_ENABLED=${ZK_TCP_PULL_ENABLED:-true}
      - ZK_TCP_PULL_CRON=${ZK_TCP_PULL_CRON:-*/3 * * * *}
      - ZK_TCP_PULL_TIMEOUT_MS=${ZK_TCP_PULL_TIMEOUT_MS:-20000}
      - ZK_TCP_PULL_UDP_INPORT=${ZK_TCP_PULL_UDP_INPORT:-4000}
      # Outbound app email: HR Admin → Email settings per org (SendGrid/SMTP stored in DB). Do not use SENDGRID_*/SMTP_* here for product mail.
      - SCHEDULED_EXPORT_MAX_ATTACHMENT_MB=${SCHEDULED_EXPORT_MAX_ATTACHMENT_MB:-25}
      - SCHEDULED_EXPORT_S3_BUCKET=${SCHEDULED_EXPORT_S3_BUCKET:-}
      - SCHEDULED_EXPORT_S3_REGION=${SCHEDULED_EXPORT_S3_REGION:-}
      - SCHEDULED_EXPORT_S3_KEY_PREFIX=${SCHEDULED_EXPORT_S3_KEY_PREFIX:-reports}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-}
      - SCHEDULED_EXPORT_PGP_PUBLIC_KEY_ARMORED=${SCHEDULED_EXPORT_PGP_PUBLIC_KEY_ARMORED:-}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER:-}
      - NOTIFY_ATTENDANCE_EMAIL=${NOTIFY_ATTENDANCE_EMAIL:-true}
      - NOTIFY_ATTENDANCE_SMS=${NOTIFY_ATTENDANCE_SMS:-false}
      - NOTIFY_PENDING_DIGEST_ENABLED=${NOTIFY_PENDING_DIGEST_ENABLED:-true}
      - SCHEDULED_EXPORT_SFTP_HOST=${SCHEDULED_EXPORT_SFTP_HOST:-}
      - SCHEDULED_EXPORT_SFTP_PORT=${SCHEDULED_EXPORT_SFTP_PORT:-22}
      - SCHEDULED_EXPORT_SFTP_USER=${SCHEDULED_EXPORT_SFTP_USER:-}
      - SCHEDULED_EXPORT_SFTP_PASSWORD=${SCHEDULED_EXPORT_SFTP_PASSWORD:-}
      - SCHEDULED_EXPORT_SFTP_DIR=${SCHEDULED_EXPORT_SFTP_DIR:-/reports}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - web-proxy-net
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:3000/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY}
        VITE_SOCKET_BASE_URL: ${VITE_SOCKET_BASE_URL:-}
    container_name: attendance_web
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - web-proxy-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  db:
    image: postgis/postgis:15-3.3
    container_name: attendance_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-attendance}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-attendance}"]
      interval: 15s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: attendance_redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:

networks:
  default:
  web-proxy-net:
    external: true
