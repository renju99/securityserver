# Map for WebSocket / Engine.IO: avoid hard-coding Connection: Upgrade on polling requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Preserve full URI (Express registers POST /api/biometrics/log on the HR router).
    location /api/biometrics/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same-origin API paths (work even when an edge proxy mishandles /api/ stripping).
    location ^~ /auth/ {
        proxy_pass http://api:3000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite base './' + page at /hr/… → browsers request /hr/assets/*.js. Rewrite into /assets/… so the
    # block below serves real files (alias here is easy to misconfigure; API proxy must never see these).
    location ^~ /hr/assets/ {
        rewrite ^/hr/assets/(.*)$ /assets/$1 last;
    }

    # PWA files requested under /hr/… → same files at site root.
    location ~* ^/hr/(registerSW\.js|manifest\.webmanifest|sw\.js|dev-sw\.js|workbox-.+\.js)$ {
        rewrite ^/hr/(.*)$ /$1 last;
    }

    # /hr/ matches prefix location /hr/ below and would be proxied to the API (404). Serve SPA shell
    # (do not redirect: $scheme is http behind TLS, so return /hr would emit http://… and loop).
    location = /hr/ {
        rewrite ^ /index.html break;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # No ^~: allows the regex locations above to win for /hr/registerSW.js etc.
    location /hr/ {
        proxy_pass http://api:3000/hr/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /attendance/ {
        proxy_pass http://api:3000/attendance/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/uploads {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        proxy_pass http://api:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /iclock/ {
        proxy_pass http://api:3000/iclock/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /socket.io/ {
        proxy_pass http://api:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Hashed Vite assets: safe to cache aggressively. SPA shell (index.html) falls through below.
    location ~* ^/assets/.*\.(?:js|mjs|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PWA files live next to index.html. If they are missing, do NOT serve index.html here — that is
    # text/html and breaks strict MIME checks for registerSW.js and the web manifest parser.
    location ~* ^/(registerSW\.js|manifest\.webmanifest|sw\.js|dev-sw\.js|workbox-.+\.js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}
