services:
  # Backend API
  api:
    build: ./backend
    container_name: attendance_api
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://user:password@db:5432/attendance
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_change_me}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me}
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    networks:
      - default
      - web-proxy-net
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:3000/healthz || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend PWA
  web:
    build: ./frontend
    container_name: attendance_web
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_GOOGLE_MAPS_API_KEY=${VITE_GOOGLE_MAPS_API_KEY:-}
    networks:
      - default
      - web-proxy-net

  # Database with PostGIS
  db:
    image: postgis/postgis:15-3.3
    container_name: attendance_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: attendance
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - default

  # Redis for Caching
  redis:
    image: redis:alpine
    container_name: attendance_redis
    networks:
      - default

  # RA08 Facial Recognition Listener
  ra08-service:
    build: ./ra08-listener
    container_name: ra08_service
    environment:
      - BACKEND_URL=http://api:3000/api/biometrics/log
      - INTERNAL_TOKEN=attendance_secret_token
      - DEDUP_WINDOW_SECONDS=300 # Skip duplicate captures within 5 minutes
      - IMAGE_RETENTION_HOURS=2160 # Auto-delete images older than 90 days
      - MAX_CAPTURES_DIR_MB=500 # Stop saving if captures exceed 500MB
      - CLEANUP_INTERVAL_SECONDS=3600 # Run cleanup every 1 hour
    volumes:
      - ./ra08-listener/captures:/app/captures
    ports:
      - "8001:8000"
    depends_on:
      - api
    networks:
      - default
      - web-proxy-net
    restart: always

volumes:
  postgres_data:


networks:
  default:
  web-proxy-net:
    external: true
