name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  guardlink-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Python syntax
        run: python -m compileall -q security/custom_addons/guardpro

      - name: Validate XML data files
        run: |
          python - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET

          root = pathlib.Path('security/custom_addons/guardpro')
          count = 0
          for path in sorted(root.rglob('*.xml')):
              ET.parse(path)
              count += 1
          print(f'Validated {count} XML files')
          PY

      - name: Validate module manifest
        run: python -c "exec(open('security/custom_addons/guardpro/__manifest__.py').read())"
