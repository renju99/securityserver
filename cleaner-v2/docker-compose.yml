version: '3.8'

services:
  db:
    image: postgres:15
    container_name: cleaner-db
    restart: always
    environment:
      POSTGRES_DB: cleaner_attendance
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    networks:
      - cleaner-net
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: cleaner-redis
    restart: always
    networks:
      - cleaner-net

  backend:
    build: ./backend
    container_name: cleaner-backend
    restart: always
    environment:
      DATABASE_URL: postgres://admin:password123@db:5432/cleaner_attendance
      REDIS_URL: redis://redis:6379
      PORT: 3001
      JWT_SECRET: your_super_secret_key
    depends_on:
      - db
      - redis
    networks:
      - cleaner-net
      - web-proxy-net

  frontend:
    build: ./frontend
    container_name: cleaner-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - cleaner-net
      - web-proxy-net

networks:
  cleaner-net:
    driver: bridge
  web-proxy-net:
    external: true

volumes:
  postgres_data:
