# Start only redis, backend, frontend. Use when db is already running (e.g. started with docker run).
# Run: docker network connect cleaner-v2_cleaner-net cleaner-db  (once)
# Then: docker-compose -f docker-compose.app-only.yml up -d
version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: cleaner-redis
    restart: always
    networks:
      - cleaner-net

  backend:
    build: ./backend
    container_name: cleaner-backend
    restart: always
    environment:
      DATABASE_URL: postgres://admin:password123@cleaner-db:5432/cleaner_attendance
      REDIS_URL: redis://redis:6379
      PORT: 3001
      JWT_SECRET: your_super_secret_key
    depends_on:
      - redis
    networks:
      - cleaner-net
      - web-proxy-net

  frontend:
    build: ./frontend
    container_name: cleaner-frontend
    restart: always
    depends_on:
      - backend
    networks:
      - cleaner-net
      - web-proxy-net

networks:
  cleaner-net:
    driver: bridge
  web-proxy-net:
    external: true
