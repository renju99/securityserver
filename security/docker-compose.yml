services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    networks:
      - odoo-network
    restart: unless-stopped

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo

    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./custom_addons:/mnt/extra-addons
      - ./config:/etc/odoo
      - ./scripts:/scripts
    container_name: odoo
    restart: unless-stopped
    command: [ "odoo", "--config=/etc/odoo/odoo.conf" ]
    networks:
      - odoo-network
      - web-proxy-net

volumes:
  odoo-db-data:
  odoo-web-data:


networks:
  odoo-network:
    driver: bridge

  web-proxy-net:
    external: true