# Odoo + Postgres only; joins external web-proxy-net so host nginx-proxy can reach odoo-security:8069.
# For a dedicated security machine (own Nginx + Certbot on 80/443), use:
#   docker compose -f docker-compose.standalone.yml up -d

services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    networks:
      - odoo-network
    restart: unless-stopped
    # shm must exceed shared_buffers (2GB). Prevents /PostgreSQL.* shm failures.
    shm_size: "3gb"
    stop_grace_period: 60s
    # Tuned for D4as_v5 (16 GB RAM) + Premium SSD data disk
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=8GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - wal_buffers=16MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d security || pg_isready -U odoo -d postgres"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Service name must not be "odoo": odoo-attendance also exposes service "odoo" on
  # web-proxy-net, so nginx resolving hostname "odoo" could hit the wrong instance.
  odoo_security:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.storage
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo

    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./custom_addons:/mnt/extra-addons
      - ./config:/etc/odoo
      - ./scripts:/scripts
    container_name: odoo-security
    restart: unless-stopped
    shm_size: "256mb"
    command: [ "odoo", "--config=/etc/odoo/odoo.conf" ]
    networks:
      - odoo-network
      - web-proxy-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8069/web/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  odoo-db-data:
  odoo-web-data:


networks:
  odoo-network:
    driver: bridge

  web-proxy-net:
    external: true
