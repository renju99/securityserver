# Odoo + Postgres only; joins external web-proxy-net so host nginx-proxy can reach odoo-security:8069.
# For a dedicated security machine (own Nginx + Certbot on 80/443), use:
#   docker compose -f docker-compose.standalone.yml up -d

services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    networks:
      - odoo-network
    restart: unless-stopped

  # Service name must not be "odoo": odoo-attendance also exposes service "odoo" on
  # web-proxy-net, so nginx resolving hostname "odoo" could hit the wrong instance.
  odoo_security:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo

    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./custom_addons:/mnt/extra-addons
      - ./config:/etc/odoo
      - ./scripts:/scripts
    container_name: odoo-security
    restart: unless-stopped
    command: [ "odoo", "--config=/etc/odoo/odoo.conf" ]
    networks:
      - odoo-network
      - web-proxy-net

volumes:
  odoo-db-data:
  odoo-web-data:


networks:
  odoo-network:
    driver: bridge

  web-proxy-net:
    external: true