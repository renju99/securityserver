<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2C3E50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3498DB;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="#ECF0F1" stroke="#2C3E50" stroke-width="8"/>
  
  <!-- Shield -->
  <path d="M256 80 L320 120 L320 200 C320 240 280 280 256 320 C232 280 192 240 192 200 L192 120 Z" 
        fill="url(#shieldGradient)" 
        stroke="#2C3E50" 
        stroke-width="4"/>
  
  <!-- Checkmark -->
  <path d="M220 200 L240 220 L280 180" 
        stroke="white" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>
  
  <!-- Guard Badge -->
  <circle cx="256" cy="380" r="40" fill="#2C3E50"/>
  <text x="256" y="390" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">G</text>
</svg>
