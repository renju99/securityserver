# HTTP server - redirects to HTTPS (ACME challenge still works)
server {
    listen 80;
    server_name security.berkeleyuae.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name security.berkeleyuae.com;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/security.berkeleyuae.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/security.berkeleyuae.com/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Docker embedded DNS: re-resolve upstream after container restarts (avoids stale IP → 502).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Block Odoo database manager UI/API on the public edge.
    # list_db=False still serves /web/database/manager|selector HTML that accepts
    # the master password — do not expose that beyond the private network.
    location ^~ /web/database/ {
        return 404;
    }

    # Proxy to Odoo
    client_max_body_size 100M;

    # ── Mobile polling endpoints ──────────────────────────────────────────────
    # Cache keyed per user (session cookie) with a 3-second TTL.
    # proxy_cache_lock collapses a burst of concurrent requests for the same
    # key into one upstream hit — critical when 50+ guards open the app at
    # shift start.  proxy_ignore_headers lets us override the server's
    # no-cache directive for these read-only status endpoints.
    location ~* ^/guardpro/api/(emergency_broadcasts|patrol_reminders|tasks|mobile_outbox|push-to-talk)/pending {
        set $odoo_poll http://odoo-security:8069;
        proxy_pass $odoo_poll;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_connect_timeout 15s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;

        proxy_cache poll_cache;
        # Per-user key: URI + query string + session cookie value.
        proxy_cache_key "$uri$is_args$args$cookie_session_id";
        proxy_cache_valid 200 3s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 4s;
        proxy_cache_use_stale error timeout;
        # Override Odoo's no-cache/no-store so nginx actually stores the response.
        proxy_ignore_headers Cache-Control Expires;
        # Never serve one user's cached data to another user.
        proxy_no_cache $cookie_session_id;   # skip cache if no session (login page)
        proxy_cache_bypass 0;                # serve from cache when key matches
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # ── Odoo 18 assets ────────────────────────────────────────────────────────
    # Hash-versioned paths never change — cache aggressively at both proxy and
    # browser.  Reduces repeated JS/CSS downloads from every guard's device.
    location /web/assets/ {
        set $odoo_assets http://odoo-security:8069;
        proxy_pass $odoo_assets;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_cache asset_cache;
        proxy_cache_key "$uri";
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header Cache-Control "public, max-age=86400, immutable" always;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        set $odoo_http http://odoo-security:8069;
        proxy_pass $odoo_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support for Odoo
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # WebSocket endpoint (Odoo 16+)
    location /websocket {
        set $odoo_lp http://odoo-security:8072;
        proxy_pass $odoo_lp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Long polling endpoint
    location /longpolling {
        set $odoo_lp http://odoo-security:8072;
        proxy_pass $odoo_lp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

