android.useAndroidX=true
android.enableJetifier=true

# R8 full mode (do NOT set android.enableR8.fullMode=false)
# AGP 8.12+: enable optimized resource shrinking for Play optimization score
android.r8.optimizedResourceShrinking=true

# Allocate 4 GB to the Gradle daemon JVM to prevent OOM crashes during large builds.
# Without this the default heap (~512 MB) is insufficient for ExoPlayer + Media3 and
# caused java_pid*.hprof heap dumps on Aug 12-14 2026.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
