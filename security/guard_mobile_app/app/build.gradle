apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "com.berkeleyuae.guardlink"
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.berkeleyuae.guardlink"
        minSdkVersion 24
        targetSdkVersion 36
        // Release APK/AAB output: app/build/outputs/{apk,bundle}/release/
        versionCode 47
        versionName "1.2.35"
    }

    signingConfigs {
        release {
            storeFile file("release-key.jks")
            storePassword "berkeley123"
            keyAlias "guardpro"
            keyPassword "berkeley123"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.outputFileName = "guardlink-${variant.versionName}-${variant.versionCode}.apk"
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.activity:activity-ktx:1.8.2"

    // TWA / Browser Dependencies
    implementation "androidx.browser:browser:1.7.0"

    // Location Dependencies
    implementation "com.google.android.gms:play-services-location:21.0.1"

    // WebM/Opus playback for background push-to-talk
    implementation "androidx.media3:media3-exoplayer:1.4.1"

    // Networking
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp3:okhttp:4.11.0"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // Security
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
}
