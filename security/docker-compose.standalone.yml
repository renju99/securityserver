# Standalone stack for a machine that serves ONLY security.berkeleyuae.com.
# Includes Postgres, Odoo, Nginx, and Certbot on one Docker network (no web-proxy-net).
#
# Usage (from security/):
#   docker compose -f docker-compose.standalone.yml up -d
#
# First-time TLS: nginx needs cert files to start with the current vhost. Either copy
# live/security.berkeleyuae.com from your old host's LetsEncrypt volume, or obtain certs
# once with certbot --standalone while nginx is stopped (port 80 free), then up -d all.
#
# Do not run this compose on the same host as nginx-proxy with BOTH publishing 80:80
# and 443:443 — only one process can bind those ports.

name: berkeley-security

services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    networks:
      - security-internal
    restart: unless-stopped
    shm_size: "3gb"
    stop_grace_period: 60s
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=8GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - wal_buffers=16MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_connections=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d security || pg_isready -U odoo -d postgres"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  odoo_security:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./custom_addons:/mnt/extra-addons
      - ./config:/etc/odoo
      - ./scripts:/scripts
    container_name: odoo-security
    restart: unless-stopped
    shm_size: "256mb"
    command: [ "odoo", "--config=/etc/odoo/odoo.conf" ]
    networks:
      - security-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:8069/web/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  nginx:
    image: nginx:alpine
    container_name: nginx-security
    depends_on:
      odoo_security:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-config/security.berkeleyuae.com.conf:/etc/nginx/conf.d/security.berkeleyuae.com.conf:ro
      - security_letsencrypt_www:/var/www/certbot:ro
      - security_letsencrypt_conf:/etc/letsencrypt:ro
    networks:
      - security-internal
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: certbot-security
    volumes:
      - security_letsencrypt_www:/var/www/certbot
      - security_letsencrypt_conf:/etc/letsencrypt
    networks:
      - security-internal
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

volumes:
  odoo-db-data:
  odoo-web-data:
  security_letsencrypt_www:
  security_letsencrypt_conf:

networks:
  security-internal:
    driver: bridge
